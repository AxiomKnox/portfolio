name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'deploy')
    env:
      ASTRO_SITE: https://${{ github.actor }}.github.io
      ASTRO_BASE: /${{ github.event.repository.name }}
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same script as local (`bun run sync`). Fail-closed: missing PAT or any
      # remote failure aborts the job before build. Actions reserves
      # secrets.GITHUB_TOKEN for the installation token (cannot read arbitrary
      # private remotes) — store a Contents+Metadata PAT as
      # GITHUB_TOKEN and map it to the GITHUB_TOKEN env the sync
      # script expects (same name as local `.env`).
      - name: Sync content from remotes
        env:
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN }}
        run: bun run sync

      - name: Build
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'deploy')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
